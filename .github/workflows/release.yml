name: Release & Publish Container

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (simulate release without publishing tag, release, or container)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify & Cut Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: Install SQLite development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: apps/app
        run: flutter pub get

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linters
        run: pnpm lint

      - name: Run automated tests
        run: pnpm test

      - name: Build Flutter web application
        run: pnpm turbo run build:web

      - name: Fetch Git notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git fetch "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}" '+refs/notes/*:refs/notes/*'

      - name: Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          pnpm exec node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import semanticRelease from 'semantic-release';

          const dryRun = process.env.INPUT_DRY_RUN === 'true';
          const result = await semanticRelease(dryRun ? { dryRun: true } : {});
          if (result && result.nextRelease) {
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `new_release_published=true\nnew_release_version=${result.nextRelease.version}\n`
            );
          } else {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'new_release_published=false\n');
          }
          EOF

      - name: Upload Flutter web bundle
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-bundle
          path: apps/app/build/web/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Report Release Status
        if: steps.semantic.outputs.new_release_published != 'true'
        run: |
          echo "No new version was published by Semantic Release. Container build and push skipped."

  build-image:
    name: Build Image (${{ matrix.platform }})
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            cache_scope: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache_scope: linux-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Flutter web bundle
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-bundle
          path: apps/app/build/web

      - name: Prepare lowercase image name
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.new_release_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.new_release_version }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.new_release_version }}
            type=raw,value=latest

      - name: Build and push image by digest (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release.outputs.new_release_version }}
          outputs: ${{ inputs.dry_run && format('type=image,name={0},push=false', steps.image.outputs.name) || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.image.outputs.name) }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

      - name: Export image digest
        if: ${{ !inputs.dry_run }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.cache_scope }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifest:
    name: Publish Multi-Arch Manifest
    needs:
      - release
      - build-image
    if: needs.release.outputs.new_release_published == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Prepare lowercase image name
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.new_release_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.new_release_version }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.new_release_version }}
            type=raw,value=latest

      - name: Create and push multi-arch manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          cd /tmp/digests

          TAG_ARGS=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAG_ARGS+=("-t" "$tag")
          done <<< "$TAGS"

          ANNOTATION_ARGS=()
          while IFS= read -r kv; do
            [ -n "$kv" ] && ANNOTATION_ARGS+=("--annotation" "index:${kv}")
          done < <(jq -r '.labels | to_entries[] | "\(.key)=\(.value)"' <<< "$META_JSON")

          SOURCES=()
          for digest_hex in *; do
            [ -f "$digest_hex" ] && SOURCES+=("${IMAGE}@sha256:${digest_hex}")
          done

          if [ "${#SOURCES[@]}" -ne 2 ]; then
            echo "Expected 2 architecture digests, found ${#SOURCES[@]}: ${SOURCES[*]}" >&2
            exit 1
          fi

          docker buildx imagetools create \
            "${TAG_ARGS[@]}" \
            "${ANNOTATION_ARGS[@]}" \
            "${SOURCES[@]}"

      - name: Inspect published manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"
