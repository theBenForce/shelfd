name: Release & Publish Container

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (simulate release without publishing tag, release, container, or Play bundle)'
        type: boolean
        default: false
      release_tag:
        description: 'Existing vX.Y.Z git tag to retry/rollback on Google Play (skips semantic-release)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify & Cut Release
    if: ${{ inputs.release_tag == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: Install SQLite development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: apps/app
        run: flutter pub get

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linters
        run: pnpm lint

      - name: Run automated tests
        run: pnpm test

      - name: Build Flutter web application
        run: pnpm turbo run build:web

      - name: Fetch Git notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git fetch "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}" '+refs/notes/*:refs/notes/*'

      - name: Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          pnpm exec node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import semanticRelease from 'semantic-release';

          const dryRun = process.env.INPUT_DRY_RUN === 'true';
          const result = await semanticRelease(dryRun ? { dryRun: true } : {});
          if (result && result.nextRelease) {
            fs.appendFileSync(
              process.env.GITHUB_OUTPUT,
              `new_release_published=true\nnew_release_version=${result.nextRelease.version}\n`
            );
          } else {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'new_release_published=false\n');
          }
          EOF

      - name: Upload Flutter web bundle
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-bundle
          path: apps/app/build/web/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Report Release Status
        if: steps.semantic.outputs.new_release_published != 'true'
        run: |
          echo "No new version was published by Semantic Release. Container build and push skipped."

  build-image:
    name: Build Image (${{ matrix.platform }})
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            cache_scope: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache_scope: linux-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Flutter web bundle
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-bundle
          path: apps/app/build/web

      - name: Prepare lowercase image name
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.new_release_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.new_release_version }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.new_release_version }}
            type=raw,value=latest

      - name: Build and push image by digest (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release.outputs.new_release_version }}
          outputs: ${{ inputs.dry_run && format('type=image,name={0},push=false', steps.image.outputs.name) || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.image.outputs.name) }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

      - name: Export image digest
        if: ${{ !inputs.dry_run }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.cache_scope }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifest:
    name: Publish Multi-Arch Manifest
    needs:
      - release
      - build-image
    if: needs.release.outputs.new_release_published == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Prepare lowercase image name
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.new_release_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.new_release_version }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.new_release_version }}
            type=raw,value=latest

      - name: Create and push multi-arch manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          cd /tmp/digests

          TAG_ARGS=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && TAG_ARGS+=("-t" "$tag")
          done <<< "$TAGS"

          ANNOTATION_ARGS=()
          while IFS= read -r kv; do
            [ -n "$kv" ] && ANNOTATION_ARGS+=("--annotation" "index:${kv}")
          done < <(jq -r '.labels | to_entries[] | "\(.key)=\(.value)"' <<< "$META_JSON")

          SOURCES=()
          for digest_hex in *; do
            [ -f "$digest_hex" ] && SOURCES+=("${IMAGE}@sha256:${digest_hex}")
          done

          if [ "${#SOURCES[@]}" -ne 2 ]; then
            echo "Expected 2 architecture digests, found ${#SOURCES[@]}: ${SOURCES[*]}" >&2
            exit 1
          fi

          docker buildx imagetools create \
            "${TAG_ARGS[@]}" \
            "${ANNOTATION_ARGS[@]}" \
            "${SOURCES[@]}"

      - name: Inspect published manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

  publish-android:
    name: Publish Android App Bundle (Internal)
    needs: release
    if: ${{ always() && !cancelled() && ((needs.release.result == 'success' && needs.release.outputs.new_release_published == 'true') || (needs.release.result == 'skipped' && inputs.release_tag != '')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Resolve target version and ref
        id: target
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          SEMANTIC_VERSION: ${{ needs.release.outputs.new_release_version }}
          IS_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_RELEASE_TAG}" ]; then
            if [[ ! "${INPUT_RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release_tag '${INPUT_RELEASE_TAG}'. Expected format vX.Y.Z." >&2
              exit 1
            fi
            VERSION="${INPUT_RELEASE_TAG#v}"
            CHECKOUT_REF="refs/tags/${INPUT_RELEASE_TAG}"
          else
            VERSION="${SEMANTIC_VERSION}"
            if [[ ! "v${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid semantic version '${VERSION}'." >&2
              exit 1
            fi
            if [ "${IS_DRY_RUN}" = "true" ]; then
              CHECKOUT_REF="${GITHUB_SHA}"
            else
              CHECKOUT_REF="refs/tags/v${VERSION}"
            fi
          fi
          # Note: github.run_number is scoped to .github/workflows/release.yml.
          # If this workflow file is ever renamed, raise the 100000 base offset.
          BUILD_NUMBER=$((100000 + GITHUB_RUN_NUMBER))
          if [ "${BUILD_NUMBER}" -le 100000 ]; then
            echo "Computed BUILD_NUMBER (${BUILD_NUMBER}) must exceed 100000." >&2
            exit 1
          fi
          {
            echo "version=${VERSION}"
            echo "checkout_ref=${CHECKOUT_REF}"
            echo "build_number=${BUILD_NUMBER}"
          } >> "${GITHUB_OUTPUT}"

      - name: Checkout target release ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.checkout_ref }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android signing keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          IS_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="${RUNNER_TEMP}/upload-keystore.jks"
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_FILE}"
            echo "keystore_path=${KEYSTORE_FILE}" >> "${GITHUB_OUTPUT}"
            echo "ephemeral=false" >> "${GITHUB_OUTPUT}"
          elif [ "${IS_DRY_RUN}" = "true" ]; then
            keytool -genkeypair \
              -keystore "${KEYSTORE_FILE}" \
              -storetype JKS \
              -keyalg RSA \
              -keysize 2048 \
              -validity 1 \
              -alias dryrun \
              -storepass dryrunpass \
              -keypass dryrunpass \
              -dname "CN=Shelfd Dry Run,O=Shelfd,C=US"
            echo "keystore_path=${KEYSTORE_FILE}" >> "${GITHUB_OUTPUT}"
            echo "ephemeral=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Missing ANDROID_KEYSTORE_BASE64 secret for Android release build." >&2
            exit 1
          fi
          if [ "${IS_DRY_RUN}" != "true" ] && [ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}" ]; then
            echo "Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret for Google Play upload." >&2
            exit 1
          fi

      - name: Resolve Flutter dependencies
        working-directory: apps/app
        run: flutter pub get

      - name: Build signed Android App Bundle
        working-directory: apps/app
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.ephemeral == 'true' && 'dryrunpass' || secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ steps.keystore.outputs.ephemeral == 'true' && 'dryrun' || secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ steps.keystore.outputs.ephemeral == 'true' && 'dryrunpass' || secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.target.outputs.version }}
          BUILD_NUMBER: ${{ steps.target.outputs.build_number }}
        run: |
          flutter build appbundle --release \
            --build-name="${VERSION}" \
            --build-number="${BUILD_NUMBER}"

      - name: Verify merged manifest permissions and 16 KB ELF alignment
        run: |
          set -euo pipefail
          MANIFEST="apps/app/build/app/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml"
          test -f "${MANIFEST}"
          if grep -q 'android.permission.CAMERA' "${MANIFEST}"; then
            echo "Merged release AndroidManifest.xml unexpectedly contains android.permission.CAMERA" >&2
            exit 1
          fi
          AAB="apps/app/build/app/outputs/bundle/release/app-release.aab"
          test -f "${AAB}"
          EXTRACT_DIR="$(mktemp -d)"
          unzip -q "${AAB}" 'base/lib/arm64-v8a/*.so' 'base/lib/x86_64/*.so' -d "${EXTRACT_DIR}"
          SO_COUNT=0
          while IFS= read -r -d '' so_file; do
            SO_COUNT=$((SO_COUNT + 1))
            while IFS= read -r align_hex; do
              align_val=$((align_hex))
              if [ "${align_val}" -lt $((0x4000)) ]; then
                echo "Library ${so_file} has LOAD alignment ${align_hex} (< 0x4000)" >&2
                exit 1
              fi
            done < <(readelf -lW "${so_file}" | awk '$1 == "LOAD" { print $NF }')
          done < <(find "${EXTRACT_DIR}/base/lib" -name '*.so' -print0)
          rm -rf "${EXTRACT_DIR}"
          if [ "${SO_COUNT}" -eq 0 ]; then
            echo "No native .so libraries found in ${AAB}" >&2
            exit 1
          fi

      - name: Upload Android App Bundle and R8 mapping artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shelfd-android-v${{ steps.target.outputs.version }}-${{ steps.target.outputs.build_number }}
          path: |
            apps/app/build/app/outputs/bundle/release/app-release.aab
            apps/app/build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Google Play internal track
        if: ${{ !inputs.dry_run }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.justwriteapps.shelfd
          releaseFiles: apps/app/build/app/outputs/bundle/release/app-release.aab
          mappingFile: apps/app/build/app/outputs/mapping/release/mapping.txt
          track: internal
          status: completed

      - name: Clean temporary keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/upload-keystore.jks"
