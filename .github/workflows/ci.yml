name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Cache Android NDK and CMake
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/cmake/3.22.1
          key: android-sdk-ndk28c-cmake322-${{ runner.os }}

      - name: Install SQLite development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: apps/app
        run: flutter pub get

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linters
        run: pnpm lint

      - name: Run automated tests
        run: pnpm test

      - name: Build standalone Shelfd Go server
        run: pnpm --filter @shelfd/server build

      - name: Run live-server Flutter integration tests
        id: live_e2e
        env:
          SHELFD_ADMIN_USERNAME: admin
          SHELFD_ADMIN_PASSWORD: ci-test-pass
        run: |
          set -euo pipefail
          LIVE_TMP="$(mktemp -d)"
          mkdir -p "${LIVE_TMP}/data" "${LIVE_TMP}/library" "${LIVE_TMP}/plugins"
          SHELFD_SERVER_HOST=127.0.0.1 \
          SHELFD_SERVER_PORT=18080 \
          SHELFD_STORAGE_DATA_DIR="${LIVE_TMP}/data" \
          SHELFD_SQLITE_PATH="${LIVE_TMP}/data/sqlite.db" \
          SHELFD_STORAGE_LIBRARY_DIR="${LIVE_TMP}/library" \
          SHELFD_PLUGINS_DIR="${LIVE_TMP}/plugins" \
          SHELFD_CAST_ENABLED=false \
          SHELFD_JWT_SECRET="ci-live-jwt-secret-key-0123456789" \
          SHELFD_ADMIN_USERNAME="${SHELFD_ADMIN_USERNAME}" \
          SHELFD_ADMIN_PASSWORD="${SHELFD_ADMIN_PASSWORD}" \
          ./apps/server/dist/shelfd > /tmp/shelfd-ci-live.log 2>&1 &
          SHELFD_PID=$!
          trap 'kill "${SHELFD_PID}" 2>/dev/null || true; rm -rf "${LIVE_TMP}"' EXIT

          READY=0
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 0.25
          done
          if [ "${READY}" -ne 1 ]; then
            echo "Shelfd server failed to become healthy within 10s" >&2
            exit 1
          fi

          SHELFD_LIVE_URL=http://127.0.0.1:18080 pnpm --filter @shelfd/app test:live

      - name: Dump Shelfd server logs on live E2E failure
        if: failure() && steps.live_e2e.outcome == 'failure'
        run: |
          if [ -f /tmp/shelfd-ci-live.log ]; then
            cat /tmp/shelfd-ci-live.log
          fi

      - name: Build Flutter web application
        run: pnpm turbo run build:web

      - name: Build debug Android App Bundle
        run: pnpm --filter @shelfd/app build:aab --debug

      - name: Verify Android merged manifest and 16 KB ELF alignment
        run: |
          set -euo pipefail
          MANIFEST="apps/app/build/app/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml"
          test -f "${MANIFEST}"
          if grep -q 'android.permission.CAMERA' "${MANIFEST}"; then
            echo "Merged AndroidManifest.xml unexpectedly contains android.permission.CAMERA" >&2
            exit 1
          fi
          AAB="apps/app/build/app/outputs/bundle/debug/app-debug.aab"
          test -f "${AAB}"
          EXTRACT_DIR="$(mktemp -d)"
          unzip -q "${AAB}" 'base/lib/arm64-v8a/*.so' 'base/lib/x86_64/*.so' -d "${EXTRACT_DIR}"
          SO_COUNT=0
          while IFS= read -r -d '' so_file; do
            SO_COUNT=$((SO_COUNT + 1))
            while IFS= read -r align_hex; do
              align_val=$((align_hex))
              if [ "${align_val}" -lt $((0x4000)) ]; then
                echo "Library ${so_file} has LOAD alignment ${align_hex} (< 0x4000)" >&2
                exit 1
              fi
            done < <(readelf -lW "${so_file}" | awk '$1 == "LOAD" { print $NF }')
          done < <(find "${EXTRACT_DIR}/base/lib" -name '*.so' -print0)
          rm -rf "${EXTRACT_DIR}"
          if [ "${SO_COUNT}" -eq 0 ]; then
            echo "No native .so libraries found in ${AAB}" >&2
            exit 1
          fi
