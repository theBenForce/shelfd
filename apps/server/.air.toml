# .air.toml
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -tags sqlite_fts5 -o ./tmp/main ./cmd/server"
  bin = "./tmp/main"
  full_bin = ""
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "json"]
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "bin", "dist"]
  include_dir = []
  exclude_file = []
  exclude_regex = ["_test\\.go$"]
  exclude_unchanged = false
  follow_symlink = false
  log = "air.log"
  poll = false
  poll_interval = 0
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = 500
  rerun = false
  rerun_delay = 500

[log]
  time = true
  main_only = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
