services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: shelfd-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=shelfd
      - POSTGRES_USER=shelfd
      - POSTGRES_PASSWORD=shelfd_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelfd -d shelfd"]
      interval: 5s
      timeout: 5s
      retries: 5

  shelfd:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/shelfd/shelfd:latest
    container_name: shelfd
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - PUID=501
      - PGID=20
      - UMASK=002
      - TZ=America/Chicago

      # Database Configuration (PostgreSQL with pgvector)
      - SHELFD_DATABASE_TYPE=postgres
      - SHELFD_DATABASE_POSTGRES_DSN=postgres://shelfd:shelfd_password@postgres:5432/shelfd?sslmode=disable

      # LM Studio Local Instance Configuration
      - SHELFD_AI_PROVIDER=openai
      - SHELFD_AI_BASE_URL=http://host.docker.internal:1234
      - SHELFD_AI_API_KEY=lm-studio
      - SHELFD_AI_EMBEDDING_MODEL=text-embedding-nomic-embed-text-v1.5@q8_0
      - SHELFD_AI_EMBEDDING_DIMENSIONS=768
      - SHELFD_AI_SUMMARY_MODEL=google/gemma-4-e4b
      - SHELFD_JWT_SECRET=shelfd-homelab-jwt-secret-key-32bytes
    volumes:
      # Shelfd state: extracted covers and temporary files
      - ./data:/data
      # Shared Audiobookshelf library (read-write for EPUB upload)
      - /Users/bforce/books:/library:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
