# ==============================================================================
# Shelfd Production Configuration Example
# ==============================================================================
# All settings can also be overridden using SHELFD_* environment variables
# (e.g. SHELFD_SERVER_PORT=8080, SHELFD_AI_PROVIDER=openai, etc.).
# ==============================================================================

server:
  host: "0.0.0.0"
  port: 8080
  # Secret key used to sign JWT authentication tokens for the REST API.
  # If left blank, a random key is generated and persisted in <data_dir>/.jwt_secret.
  jwt_secret: ""

database:
  # Database type: "sqlite" (default Phase 1 MVP) or "postgres"
  type: "sqlite"
  sqlite:
    path: "/data/sqlite.db"
  postgres:
    # Example for local container or remote NAS (e.g. minidata):
    # dsn: "postgres://shelfd:shelfd_password@localhost:5432/shelfd?sslmode=disable"
    dsn: ""

storage:
  # Path to the shared ebook library (read-write for non-destructive uploads).
  # Shelfd never mutates or deletes existing metadata, descriptions, or audio files.
  # Newly uploaded books are saved to: <library_dir>/<Author>/<Title>/<Title>.epub
  library_dir: "/library"

  # Path to Shelfd internal state, vector embeddings, and extracted cover art.
  data_dir: "/data"

ai:
  # AI Provider for semantic embeddings and reader chat: "ollama", "openai", or "google" ("gemini")
  # Library ingestion strictly uses the embedding model with per-paragraph batching.
  # The chat model is only invoked for interactive reader chat in the book details page.
  provider: "ollama"

  # Ollama Configuration:
  # Use host.docker.internal:11434 if Ollama is running directly on your Docker host.
  base_url: "http://host.docker.internal:11434"
  api_key: ""
  embedding_model: "nomic-embed-text"
  embedding_dimensions: 256
  chat_model: "llama3.2:3b"

  # Google Gemini Configuration Example:
  # provider: "google"
  # api_key: "AIzaSy..."
  # embedding_model: "text-embedding-004"
  # embedding_dimensions: 256
  # chat_model: "gemini-1.5-flash"

  # OpenAI Configuration Example:
  # provider: "openai"
  # base_url: "https://api.openai.com/v1"
  # api_key: "sk-your-openai-api-key"
  # embedding_model: "text-embedding-3-small"
  # embedding_dimensions: 256
  # chat_model: "gpt-4o-mini"
  #
  # omlx (Local Apple Silicon MLX Server) Example:
  # provider: "openai"
  # base_url: "http://127.0.0.1:8000/v1"
  # api_key: "sk-omlx-..."
  # embedding_model: "mlx-community/Qwen3-Embedding-0.6B-4bit-DWQ"
  # embedding_dimensions: 256
  # chat_model: "gemma-4-E4B-it-MLX-4bit"
  #
  # Decoupled Endpoints Example (Local Ollama embeddings + Remote OpenAI chat):
  # embedder:
  #   provider: "ollama"
  #   base_url: "http://host.docker.internal:11434"
  #   model: "nomic-embed-text"
  #   dimensions: 256
  # chat:
  #   provider: "openai"
  #   base_url: "https://api.openai.com/v1"
  #   api_key: "sk-..."
  #   model: "gpt-4o-mini"

mcp:
  # Model Context Protocol (MCP) server integration for AI agents (Cursor, Claude Desktop)
  enabled: true
  path: "/mcp"

auth:
  # Initial administrator account configuration (created on first run if missing).
  # Can also be set via SHELFD_ADMIN_USERNAME and SHELFD_ADMIN_PASSWORD.
  admin_username: "admin"
  admin_password: ""

logging:
  # Log level: "debug", "info", "warn", or "error" (default: "info")
  level: "info"
  # Log format: "text" (human-readable console) or "json" (structured JSON for Loki/Docker)
  format: "text"

plugins:
  # Directory containing runtime-installable plugin packages (defaults to <data_dir>/plugins).
  # Can also be overridden via SHELFD_PLUGINS_DIR.
  dir: "/data/plugins"
  # Seconds of inactivity before non-daemon child plugin processes are stopped (default: 120).
  idle_timeout_seconds: 120
  # TTL in seconds for cached plugin storefront catalog responses (default: 900 = 15m; set -1 to disable).
  # Can also be overridden via SHELFD_PLUGINS_CATALOG_CACHE_TTL_SECONDS.
  catalog_cache_ttl_seconds: 900

cache:
  # Optional Redis URL for shared/persistent caching (e.g. "redis://localhost:6379/0" or "rediss://...").
  # Leave empty to use the built-in in-memory cache (SHELFD_REDIS_URL).
  redis_url: ""
  # Optional Redis key namespace prefix (default: "shelfd", SHELFD_CACHE_KEY_PREFIX).
  key_prefix: "shelfd"

cast:
  # Enable server-side CastV2 discovery and playback control (SHELFD_CAST_ENABLED).
  enabled: true
  # Optional LAN-reachable base URL for Chromecast media fetches when running behind Docker NAT or reverse proxy.
  # Example: "http://192.168.1.50:8080" (SHELFD_CAST_LAN_BASE_URL).
  lan_base_url: ""
  # Optional static Cast devices for Docker bridge networks where mDNS multicast cannot cross NAT.
  # Env override: SHELFD_CAST_STATIC_DEVICES="tv1|Living Room TV|192.168.1.40:8009|true|Chromecast"
  static_devices: []



