# ==============================================================================
# Shelfd Production Configuration Example
# ==============================================================================
# All settings can also be overridden using SHELFD_* environment variables
# (e.g. SHELFD_SERVER_PORT=8080, SHELFD_AI_PROVIDER=openai, etc.).
# ==============================================================================

server:
  host: "0.0.0.0"
  port: 8080
  # Secret key used to sign JWT authentication tokens for the REST API.
  # If left blank, an ephemeral random key is generated on each startup.
  jwt_secret: ""

database:
  # Database type: "sqlite" (default Phase 1 MVP) or "postgres"
  type: "sqlite"
  sqlite:
    path: "/data/sqlite.db"
  postgres:
    # Example for local container or remote NAS (e.g. minidata):
    # dsn: "postgres://shelfd:shelfd_password@localhost:5432/shelfd?sslmode=disable"
    dsn: ""

storage:
  # Path to the shared ebook library (read-write for non-destructive uploads).
  # Shelfd never mutates or deletes existing metadata, descriptions, or audio files.
  # Newly uploaded books are saved to: <library_dir>/<Author>/<Title>/<Title>.epub
  library_dir: "/library"

  # Path to Shelfd internal state, vector embeddings, and extracted cover art.
  data_dir: "/data"

ai:
  # AI Provider for semantic embeddings and reader chat: "ollama", "openai", or "google" ("gemini")
  # Library ingestion strictly uses the embedding model with per-paragraph batching.
  # The chat model is only invoked for interactive reader chat in the book details page.
  provider: "ollama"

  # Ollama Configuration:
  # Use host.docker.internal:11434 if Ollama is running directly on your Docker host.
  base_url: "http://host.docker.internal:11434"
  api_key: ""
  embedding_model: "nomic-embed-text"
  embedding_dimensions: 256
  chat_model: "llama3.2:3b"

  # Google Gemini Configuration Example:
  # provider: "google"
  # api_key: "AIzaSy..."
  # embedding_model: "text-embedding-004"
  # embedding_dimensions: 256
  # chat_model: "gemini-1.5-flash"

  # OpenAI Configuration Example:
  # provider: "openai"
  # base_url: "https://api.openai.com/v1"
  # api_key: "sk-your-openai-api-key"
  # embedding_model: "text-embedding-3-small"
  # embedding_dimensions: 256
  # chat_model: "gpt-4o-mini"
  #
  # omlx (Local Apple Silicon MLX Server) Example:
  # provider: "openai"
  # base_url: "http://127.0.0.1:8000/v1"
  # api_key: "sk-omlx-..."
  # embedding_model: "mlx-community/Qwen3-Embedding-0.6B-4bit-DWQ"
  # embedding_dimensions: 256
  # chat_model: "gemma-4-E4B-it-MLX-4bit"

mcp:
  # Model Context Protocol (MCP) server integration for AI agents (Cursor, Claude Desktop)
  enabled: true
  path: "/mcp"

auth:
  # Initial administrator account configuration (created on first run if missing).
  # Can also be set via SHELFD_ADMIN_USERNAME and SHELFD_ADMIN_PASSWORD.
  admin_username: "admin"
  admin_password: ""

logging:
  # Log level: "debug", "info", "warn", or "error" (default: "info")
  level: "info"
  # Log format: "text" (human-readable console) or "json" (structured JSON for Loki/Docker)
  format: "text"
